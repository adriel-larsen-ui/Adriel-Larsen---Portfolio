    <div class="container">

        <h1>Email me your inquiry</h1>
        
        <form class="contact-input" action="/submit-data" method="POST">
            <!-- <label class="contact-title" for="username">Email me</label> -->
            <input class="contact-name" type="text" placeholder="Name" required>
            <input class="contact-company" type="text" placeholder="Company" required>
            <input class="contact-email" type="email" placeholder="Email Address" required>
            <input class="contact-tel" type="tel" placeholder="Phone Number" required>
            <textarea class="contact-text" placeholder="Your inquiry..."></textarea>
            <input class="contact-submit" type="submit" value="Submit">
        </form>
    </div>
