<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adriel Larsen</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .link {
            display: block;
            padding: 16px 20px;
            margin: 15px 0;
            border-radius: 10px;
            background: #ffffff;
            color: #222;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <header>
        <a class="link href="#id-name">About</a>
        <a class="link" href="#id-name">Contact Me</a>
        <a class="link" href="#id-name">My Projects</a>
    </header>

    <div class="container">

        <h1>Overview</h1>

        <p>Welcome! Here are my links.</p>

        <a class="link" href="https://example.com" target="_blank">
            Link One
        </a>

        <a class="link" href="https://example.org" target="_blank">
            Link Two
        </a>

        <footer>
            Website created and managed by Adriel Larsen © 2026
        </footer>

    </div>

</body>
</html>
