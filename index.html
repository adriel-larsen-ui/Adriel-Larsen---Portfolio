<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adriel Larsen</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            padding-top: 60px; /* Adjust to navbar's exact height */
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }
        /* Style the navbar container */
        .navbar {
            position: fixed;   /* Locks the bar in place */
            top: 0;            /* Sticks it directly to the very top */
            left: 0;           /* Aligns it to the left edge */
            width: 100%;       /* Ensures it stretches all the way across */
            z-index: 1000;     /* Keeps it on top of other overlapping elements */
        }
        .logo {
            background-color: #00bcd4; /* Solid color fill */
            color: red;              /* Text color */
            padding: 8px 16px;         /* Adds space around the text */
            border-radius: 4px;        /* Optional: rounds the corners */
        }
        /* 1. Target the ul container holding your list items */
        .nav-links {
            display: flex;       /* Turns the vertical list into a horizontal row */
            list-style: none;    /* Removes the default bullet points */
            gap: 20px;           /* Adds space between each navigation item */
        }
        /* 2. Optional: Style the links inside for better spacing */
        .nav-links li a {
            text-decoration: none; /* Removes the underline */
            padding: 10px 15px;    /* Makes the clickable area larger */
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #723;
            margin-bottom: 30px;
        }

        .link {
            display: block;
            padding: 16px 20px;
            margin: 15px 0;
            border-radius: 10px;
            background: #ffffff;
            color: #222;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>
    
    <nav class="navbar">
        <div class="logo">ADRIEL LARSEN</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <div class="container">

        <h1>Overview</h1>

        <p>Welcome! Here are my links.</p>

        <a class="link" href="https://example.com" target="_blank">
            Link One
        </a>

        <a class="link" href="https://example.org" target="_blank">
            Link Two
        </a>

        <footer>
            Website created and managed by Adriel Larsen © 2026
        </footer>

    </div>

</body>
</html>
